<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<style>
  :root {
    --bg: #f4f6f8;
    --card-bg: #ffffff;
    --text: #1a1a2e;
    --muted: #6b7280;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --error: #dc2626;
    --border: #e5e7eb;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1117;
      --card-bg: #1a1d27;
      --text: #f1f1f5;
      --muted: #9ca3af;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --error: #f87171;
      --border: #2d303c;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 36px 32px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }

  .card h1 {
    font-size: 22px;
    margin: 0 0 6px;
    text-align: center;
  }

  .card p.subtitle {
    margin: 0 0 24px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
  }

  label {
    display: block;
    font-size: 13px;
    margin-bottom: 6px;
    color: var(--muted);
  }

  input {
    width: 100%;
    padding: 11px 12px;
    margin-bottom: 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  input:focus { border-color: var(--accent); }

  button {
    width: 100%;
    padding: 12px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }

  button:hover { background: var(--accent-hover); }

  #message {
    margin-top: 14px;
    font-size: 13px;
    text-align: center;
    min-height: 18px;
  }

  #message.error { color: var(--error); }
  #message.success { color: #16a34a; }

  .hint {
    margin-top: 18px;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
  }
</style>
</head>
<body>

  <div class="card">
    <h1>Iniciar sesión</h1>
    <p class="subtitle">Accede con tu usuario y contraseña</p>

    <form id="loginForm">
      <label for="username">Usuario</label>
      <input type="text" id="username" placeholder="admin" autocomplete="username" required>

      <label for="password">Contraseña</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>

      <button type="submit">Entrar</button>
    </form>

    <div id="message"></div>

    <p class="hint">Demo — usuario: <strong>admin</strong> · contraseña: <strong>1234</strong></p>
  </div>

  <script>
    // NOTA: Esto es una validación simulada en el navegador (front-end).
    // GitHub Pages solo sirve archivos estáticos, no tiene backend/base de datos,
    // así que esto NO es un login real ni seguro para producción.
    const USUARIO_VALIDO = "admin";
    const CONTRASENA_VALIDA = "1234";

    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const usuario = document.getElementById("username").value.trim();
      const contrasena = document.getElementById("password").value.trim();

      if (usuario === USUARIO_VALIDO && contrasena === CONTRASENA_VALIDA) {
        message.textContent = "✅ Acceso correcto. Redirigiendo...";
        message.className = "success";
        window.location.href = "publicar-github.html";
      } else {
        message.textContent = "❌ Usuario o contraseña incorrectos.";
        message.className = "error";
      }
    });
  </script>

</body>
</html>
