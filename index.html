<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login y Registro con Supabase</title>
<!-- Importar el SDK de Supabase desde CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root {
    --bg: #f4f6f8;
    --card-bg: #ffffff;
    --text: #1a1a2e;
    --muted: #6b7280;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --error: #dc2626;
    --success: #16a34a;
    --border: #e5e7eb;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1117;
      --card-bg: #1a1d27;
      --text: #f1f1f5;
      --muted: #9ca3af;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --error: #f87171;
      --success: #4ade80;
      --border: #2d303c;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 36px 32px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }

  .card h1 {
    font-size: 22px;
    margin: 0 0 6px;
    text-align: center;
  }

  .card p.subtitle {
    margin: 0 0 24px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
  }

  label {
    display: block;
    font-size: 13px;
    margin-bottom: 6px;
    color: var(--muted);
  }

  input {
    width: 100%;
    padding: 11px 12px;
    margin-bottom: 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  input:focus { border-color: var(--accent); }

  button.main-btn {
    width: 100%;
    padding: 12px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }

  button.main-btn:hover { background: var(--accent-hover); }

  #message {
    margin-top: 14px;
    font-size: 13px;
    text-align: center;
    min-height: 18px;
  }

  #message.error { color: var(--error); }
  #message.success { color: var(--success); }

  .toggle-container {
    margin-top: 20px;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
  }

  .toggle-btn {
    background: none;
    border: none;
    color: var(--accent);
    font-weight: 600;
    cursor: pointer;
    padding: 0;
    font-size: 13px;
    text-decoration: underline;
  }

  .toggle-btn:hover {
    color: var(--accent-hover);
  }

  .hint {
    margin-top: 18px;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
  }
</style>
</head>
<body>

  <div class="card">
    <h1 id="formTitle">Iniciar sesión</h1>
    <p class="subtitle" id="formSubtitle">Accede con tu usuario y contraseña</p>

    <form id="authForm">
      <label for="username">Usuario</label>
      <input type="text" id="username" placeholder="prueba" autocomplete="username" required>

      <label for="password">Contraseña</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>

      <button type="submit" id="submitBtn" class="main-btn">Entrar</button>
    </form>

    <div id="message"></div>

    <div class="toggle-container">
      <span id="toggleText">¿No tienes cuenta?</span>
      <button type="button" id="toggleModeBtn" class="toggle-btn">Crear un usuario</button>
    </div>

    <p class="hint">Conectado a la tabla "users" de Supabase</p>
  </div>

  <script>
    // Tus credenciales de Supabase
    const SUPABASE_URL = 'https://afzjwmizqjkizzraqgyp.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_Xcl--San70VszvRyMURKPA_al6Uartj';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const authForm = document.getElementById("authForm");
    const message = document.getElementById("message");
    const submitBtn = document.getElementById("submitBtn");
    const formTitle = document.getElementById("formTitle");
    const formSubtitle = document.getElementById("formSubtitle");
    const toggleText = document.getElementById("toggleText");
    const toggleModeBtn = document.getElementById("toggleModeBtn");

    // Estado para alternar entre Iniciar Sesión (true) y Crear Usuario (false)
    let isLoginMode = true;

    toggleModeBtn.addEventListener("click", () => {
      isLoginMode = !isLoginMode;
      message.textContent = "";
      message.className = "";

      if (isLoginMode) {
        formTitle.textContent = "Iniciar sesión";
        formSubtitle.textContent = "Accede con tu usuario y contraseña";
        submitBtn.textContent = "Entrar";
        toggleText.textContent = "¿No tienes cuenta?";
        toggleModeBtn.textContent = "Crear un usuario";
      } else {
        formTitle.textContent = "Crear usuario";
        formSubtitle.textContent = "Registra un nuevo usuario y contraseña";
        submitBtn.textContent = "Registrar";
        toggleText.textContent = "¿Ya tienes una cuenta?";
        toggleModeBtn.textContent = "Inicia sesión";
      }
    });

    authForm.addEventListener("submit", async function (e) {
      e.preventDefault();

      const usuarioIngresado = document.getElementById("username").value.trim();
      const passwordIngresado = document.getElementById("password").value.trim();

      message.textContent = "Procesando...";
      message.className = "";
      submitBtn.disabled = true;

      if (isLoginMode) {
        // --- INICIAR SESIÓN ---
        const { data, error } = await supabaseClient
          .from('users')
          .select('*')
          .eq('user', usuarioIngresado)
          .eq('pass', passwordIngresado);

        if (error) {
          message.textContent = "❌ Error de conexión: " + error.message;
          message.className = "error";
          submitBtn.disabled = false;
        } else if (data && data.length > 0) {
          message.textContent = "✅ Acceso correcto. Redirigiendo...";
          message.className = "success";

          setTimeout(() => {
            window.location.href = "explicacion.html";
          }, 1000);
        } else {
          message.textContent = "❌ Usuario o contraseña incorrectos.";
          message.className = "error";
          submitBtn.disabled = false;
        }

      } else {
        // --- CREAR NUEVO USUARIO ---
        // 1. Verificar si el nombre de usuario ya existe
        const { data: existingUsers, error: checkError } = await supabaseClient
          .from('users')
          .select('*')
          .eq('user', usuarioIngresado);

        if (checkError) {
          message.textContent = "❌ Error al verificar usuario: " + checkError.message;
          message.className = "error";
          submitBtn.disabled = false;
          return;
        }

        if (existingUsers && existingUsers.length > 0) {
          message.textContent = "❌ El nombre de usuario ya existe. Elige otro.";
          message.className = "error";
          submitBtn.disabled = false;
          return;
        }

        // 2. Insertar el nuevo registro en la tabla "users"
        const { data: newUser, error: insertError } = await supabaseClient
          .from('users')
          .insert([
            { user: usuarioIngresado, pass: passwordIngresado }
          ]);

        if (insertError) {
          message.textContent = "❌ Error al crear usuario: " + insertError.message;
          message.className = "error";
          submitBtn.disabled = false;
        } else {
          message.textContent = "✅ ¡Usuario registrado con éxito! Ya puedes iniciar sesión.";
          message.className = "success";
          submitBtn.disabled = false;

          // Cambiar automáticamente a modo login
          setTimeout(() => {
            toggleModeBtn.click();
            document.getElementById("password").value = "";
          }, 1800);
        }
      }
    });
  </script>

</body>
</html>
